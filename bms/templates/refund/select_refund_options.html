{% extends "trs_base.html" %}
{% block content %}
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="row">
        <div class="col-md-2"></div>
        <div class="col-md-5">
            <h1>Please Select Refund Option</h1>
        </div>
    </div>
    <!-- Remark -->
    <div class="row">
        <div class="col-md-2">
            <label><strong>Please Select *:</strong></label>
        </div>
        <div class="col-md-9">
            <p>{{ booking_refund_option_form.booking_refund_option }}</p>
        </div>
    </div>

    <br>
    <div class="row">
        <div class="col-md-2">
        </div>
        <div class="col-md-5">
            <p align="center">
                <button type="submit" class="btn btn-success btn-sm"  id="claim_submit_id">Confirm</button>
            </p>
        </div>
    </div>
</form>
</body>

{% endblock %}
